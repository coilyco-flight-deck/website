# Renamed 2026-08-28: the short form is canon. These two aliases still resolve
# and hold a certificate, and there is no guarded path to remove an alias yet,
# so they forward instead of serving the site root. An empty splat resolves to
# the bare host, so one rule covers the root and every path under it.
[[redirects]]
  from = "https://agent-compose.coilyco.ai/*"
  to = "https://acompose.coilyco.ai/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://mcp-beaver.coilyco.ai/*"
  to = "https://beaver.coilyco.ai/:splat"
  status = 301
  force = true
