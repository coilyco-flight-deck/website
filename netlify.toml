# docs: https://docs.netlify.com/routing/redirects

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NETLIFY_USE_PNPM = "true"
  NODE_VERSION = "24.18.0"

[[redirects]]
  from = "/now"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/life"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/my-life"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/posts/agent-launch-pillars"
  to = "/"
  status = 301

[[redirects]]
  from = "/posts/agent-launch-pillars/"
  to = "/"
  status = 301

[[redirects]]
  from = "/posts/2019-12-25-golang-pr-field-notes-part-1"
  to = "/posts/golang-pr-notes-1"

[[redirects]]
  from = "/posts/2019-12-26-golang-pr-field-notes-part-2"
  to = "/posts/golang-pr-notes-2"

[[redirects]]
  from = "/posts/2019-12-29-golang-pr-field-notes-part-3"
  to = "/posts/golang-pr-notes-3"

# coilyco.ai vanity hosts. A 200 rewrite keeps the vanity name in the address
# bar, which is the whole point, so these are rewrites rather than redirects.
# Ordering is load-bearing: Netlify takes the first match, so shared assets come
# before the catch-all. Reasoning in docs/project-page-system.md.

[[redirects]]
  from = "https://umbra.coilyco.ai/images/*"
  to = "/images/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://umbra.coilyco.ai/styles/*"
  to = "/styles/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://umbra.coilyco.ai/fonts/*"
  to = "/fonts/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://umbra.coilyco.ai/project-toc.js"
  to = "/project-toc.js"
  status = 200
  force = true

[[redirects]]
  from = "https://umbra.coilyco.ai/"
  to = "/vanity/umbra/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://umbra.coilyco.ai/*"
  to = "https://www.coilysiren.me/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://acompose.coilyco.ai/images/*"
